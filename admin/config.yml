backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "content"
    label: "Sistem ve İçerik Metinleri"
    files:
      - file: "content/en.json"
        label: "İngilizce İçerik (EN)"
        name: "en"
        fields:
          - { label: "Navigasyon - Booking", name: "navBooking", widget: "string" }
          - { label: "Navigasyon - Videos", name: "navVideos", widget: "string" }
          - { label: "Navigasyon - Biography", name: "navBio", widget: "string" }
          - { label: "Booking Başlığı", name: "titleBooking", widget: "string" }
          - { label: "Booking Açıklaması", name: "descBooking", widget: "string" }
          - { label: "Form - Ad", name: "lblFirstName", widget: "string" }
          - { label: "Form - Soyad", name: "lblLastName", widget: "string" }
          - { label: "Form - E-posta", name: "lblEmail", widget: "string" }
          - { label: "Form - Telefon", name: "lblPhone", widget: "string" }
          - { label: "Form - Etkinlik Tarihi", name: "lblEventDate", widget: "string" }
          - { label: "Form - Başlangıç Saati", name: "lblStartTime", widget: "string" }
          - { label: "Form - Etkinlik Adresi", name: "lblEventAddress", widget: "string" }
          - { label: "Form - Tercih Edilen Kurulum", name: "lblPreferredSetup", widget: "string" }
          - { label: "Form - Mesaj Kutusu Açıklaması", name: "lblMessage", widget: "string" }
          - { label: "Form - Diğer (Açıklama Kutusu)", name: "lblOtherPlaceholder", widget: "string" }
          - { label: "Form - Gönder Butonu", name: "btnSubmit", widget: "string" }
          - { label: "Form - Başarı Başlığı", name: "successTitle", widget: "string" }
          - { label: "Form - Başarı Açıklaması", name: "successDesc", widget: "string" }
          - { label: "Videos Başlığı", name: "titleVideos", widget: "string" }
          - { label: "Biography Başlığı", name: "titleBio", widget: "string" }
          - { label: "Biography Alt Başlığı", name: "subtitleBio", widget: "string" }
          - { label: "Kurulum Seçeneği - Solo", name: "chkSolo", widget: "string" }
          - { label: "Kurulum Seçeneği - DJ", name: "chkDj", widget: "string" }
          - label: "Etkinlik Türü Seçenekleri"
            name: "eventOptions"
            widget: "list"
            fields:
              - { label: "Değer (ID)", name: "val", widget: "string" }
              - { label: "Görünen Metin", name: "text", widget: "string" }
          - { label: "Biyografi Paragrafları", name: "bio", widget: "list" }
          - { label: "Sol Logo / Fotoğraf", name: "headerImgLeft", widget: "image" }
          - { label: "Sağ Logo / Fotoğraf", name: "headerImgRight", widget: "image" }

      - file: "content/tr.json"
        label: "Türkçe İçerik (TR)"
        name: "tr"
        fields:
          - { label: "Navigasyon - Booking", name: "navBooking", widget: "string" }
          - { label: "Navigasyon - Videos", name: "navVideos", widget: "string" }
          - { label: "Navigasyon - Biography", name: "navBio", widget: "string" }
          - { label: "Booking Başlığı", name: "titleBooking", widget: "string" }
          - { label: "Booking Açıklaması", name: "descBooking", widget: "string" }
          - { label: "Form - Ad", name: "lblFirstName", widget: "string" }
          - { label: "Form - Soyad", name: "lblLastName", widget: "string" }
          - { label: "Form - E-posta", name: "lblEmail", widget: "string" }
          - { label: "Form - Telefon", name: "lblPhone", widget: "string" }
          - { label: "Form - Etkinlik Tarihi", name: "lblEventDate", widget: "string" }
          - { label: "Form - Başlangıç Saati", name: "lblStartTime", widget: "string" }
          - { label: "Form - Etkinlik Adresi", name: "lblEventAddress", widget: "string" }
          - { label: "Form - Tercih Edilen Kurulum", name: "lblPreferredSetup", widget: "string" }
          - { label: "Form - Mesaj Kutusu Açıklaması", name: "lblMessage", widget: "string" }
          - { label: "Form - Diğer (Açıklama Kutusu)", name: "lblOtherPlaceholder", widget: "string" }
          - { label: "Form - Gönder Butonu", name: "btnSubmit", widget: "string" }
          - { label: "Form - Başarı Başlığı", name: "successTitle", widget: "string" }
          - { label: "Form - Başarı Açıklaması", name: "successDesc", widget: "string" }
          - { label: "Videos Başlığı", name: "titleVideos", widget: "string" }
          - { label: "Biography Başlığı", name: "titleBio", widget: "string" }
          - { label: "Biography Alt Başlığı", name: "subtitleBio", widget: "string" }
          - { label: "Kurulum Seçeneği - Solo", name: "chkSolo", widget: "string" }
          - { label: "Kurulum Seçeneği - DJ", name: "chkDj", widget: "string" }
          - label: "Etkinlik Türü Seçenekleri"
            name: "eventOptions"
            widget: "list"
            fields:
              - { label: "Değer (ID)", name: "val", widget: "string" }
              - { label: "Görünen Metin", name: "text", widget: "string" }
          - { label: "Biyografi Paragrafları", name: "bio", widget: "list" }
          - { label: "Sol Logo / Fotoğraf", name: "headerImgLeft", widget: "image" }
          - { label: "Sağ Logo / Fotoğraf", name: "headerImgRight", widget: "image" }
